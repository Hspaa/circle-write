<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>围桌写字</title>
  <meta name="description" content="多人实时在线游戏：每个人面前有一块文字板，别人可以在上面写字，但你看不到自己板子上的内容。">
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ 首页 ============ -->
  <div id="screen-home" class="screen">
    <div class="home-box">
      <div class="logo">✏️</div>
      <h1>围桌写字</h1>
      <p class="tagline">别人在你面前的板子上写字，<br>但你自己看不到自己板子的内容</p>

      <div class="field">
        <label>你的昵称</label>
        <input id="input-name" maxlength="12" placeholder="输入昵称" autocomplete="off">
      </div>

      <div class="field">
        <button id="btn-create" class="btn primary">创建房间</button>
      </div>

      <div class="divider">— 或 —</div>

      <div class="field">
        <label>加入朋友的房间</label>
        <div class="join-row">
          <input id="input-code" maxlength="4" placeholder="房间码" class="code-input" autocomplete="off">
          <button id="btn-join" class="btn">加入</button>
        </div>
      </div>

      <div id="home-error" class="error"></div>

      <details class="howto">
        <summary>📖 玩法说明</summary>
        <ol>
          <li>一个人点「创建房间」，把 4 位房间码告诉朋友。</li>
          <li>大家输入昵称和房间码入座，围桌而坐。</li>
          <li>每人面前有一块文字板：你能看到并<b>编辑别人</b>的板子。</li>
          <li>你自己面前的板子是<b>遮住的</b>，别人写了什么你看不到。</li>
          <li>正在被编辑的板子会显示「XX 正在编辑…」，其他人只读。</li>
          <li>房主可以一键「清空板子」重新开始。</li>
          <li>建议把设备<b>横过来</b>玩 📱↔️，最多 8 人一桌。</li>
        </ol>
      </details>

      <div id="conn-status" class="conn-status">连接中…</div>
    </div>
  </div>

  <!-- ============ 房间页 ============ -->
  <div id="screen-room" class="screen hidden">
    <header id="topbar">
      <div class="bar-left">
        <span class="game-title">✏️ 围桌写字</span>
        <button id="room-code-chip" class="chip" title="点击复制房间码">
          房间码 <b id="room-code">----</b>
        </button>
      </div>
      <div class="bar-center">
        <span id="player-count" class="chip">👥 0</span>
      </div>
      <div class="bar-right">
        <button id="btn-clear" class="btn danger hidden">🧹 清空板子</button>
        <button id="btn-leave" class="btn ghost">退出</button>
      </div>
    </header>

    <main id="table-wrap">
      <div id="table"></div>
      <div id="table-center">
        <div class="table-inner">
          <div class="table-emoji">🖋️</div>
          <div class="table-label">房间码</div>
          <div class="table-code" id="center-code">----</div>
        </div>
      </div>
    </main>
  </div>

  <!-- ============ 竖屏提示 ============ -->
  <div id="portrait-warning" class="portrait-warning hidden">
    <div class="pw-icon">🔄</div>
    <p>请将设备横过来使用</p>
  </div>

  <!-- ============ Toast ============ -->
  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
